training.set: ./dataset/yelp2018/train.txt

test.set: ./dataset/yelp2018/test.txt

model:
  name: XSimGCLS5
  type: graph

item.ranking.topN: [10,20]

embedding.size: 64
max.epoch: 20
batch.size: 2048
learning.rate: 0.001
reg.lambda: 0.0001

XSimGCLS5:
  n_layer: 4
  l_star: 2
  lambda: 0.2
  eps: 0.2
  tau: 0.15
  hard_neg_ratio: 0.4
  hard_neg_pool: 50

output: ./results/
