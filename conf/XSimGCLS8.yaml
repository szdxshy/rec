training.set: ./dataset/amazon-kindle/train.txt

test.set: ./dataset/amazon-kindle/test.txt

model:
  name: XSimGCLS8
  type: graph

item.ranking.topN: [10,20]

embedding.size: 64
max.epoch: 20
batch.size: 2048
learning.rate: 0.001
reg.lambda: 0.0001

XSimGCLS8:
  n_layer: 4
  l_star: 2
  lambda: 0.2
  eps: 0.2
  tau: 0.15
  soft_ratio_start: 0.05
  soft_ratio_end: 0.2

output: ./results/kindle/
