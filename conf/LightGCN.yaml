training.set: ./dataset/amazon-kindle/train.txt

test.set: ./dataset/amazon-kindle/test.txt

model:
  name: LightGCN
  type: graph

item.ranking.topN: [10,20]

embedding.size: 64
max.epoch: 50
batch.size: 2048
learning.rate: 0.001
reg.lambda: 0.0001

LightGCN:
  n_layer: 2

output: ./results/kindle/
