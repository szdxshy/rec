training.set: ./dataset/iFashion/train.txt

test.set: ./dataset/iFashion/test.txt

model:
  name: XSimGCL_neg
  type: graph

item.ranking.topN: [10,20]

embedding.size: 64
max.epoch: 20
batch.size: 2048
learning.rate: 0.001
reg.lambda: 0.0001

XSimGCL_neg:
  n_layer: 4
  l_star: 2
  lambda: 0.2
  eps: 0.2
  tau: 0.15

output: ./results/ifashion/