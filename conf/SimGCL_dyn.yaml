training.set: ./dataset/iFashion/train.txt

test.set: ./dataset/iFashion/test.txt

model:
  name: SimGCL_dyn
  type: graph

item.ranking.topN: [10,20]

embedding.size: 64
max.epoch: 20
batch.size: 2048
learning.rate: 0.001
reg.lambda: 0.0001

SimGCL_dyn:
  n_layer: 2
  lambda: 0.5
  eps: 0.1

output: ./results/ifashion/
